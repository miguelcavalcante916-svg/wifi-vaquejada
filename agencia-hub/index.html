<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>AgênciaHub — Gestão da sua agência</title>
  <meta name="description" content="Sistema de gestão para agência de marketing e produtora audiovisual: clientes, projetos, gravações, propostas e financeiro em um só lugar.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230b0e16'/><text x='50' y='68' font-size='52' text-anchor='middle'>🎬</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Menu principal">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true"></div>
        <div class="brand-text">
          <strong>AgênciaHub</strong>
          <span id="brand-agencia">Sua agência</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <span id="sidebar-hoje"></span>
      </div>
    </aside>
    <div class="backdrop" id="sidebar-backdrop" hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="btn btn-icon btn-ghost only-mobile" id="btn-menu" aria-label="Abrir menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
        </button>
        <h1 class="page-title" id="page-title">Dashboard</h1>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="print-root" class="print-root" aria-hidden="true"></div>

  <script src="js/core/store.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/clientes.js"></script>
  <script src="js/views/projetos.js"></script>
  <script src="js/views/tarefas.js"></script>
  <script src="js/views/calendario.js"></script>
  <script src="js/views/propostas.js"></script>
  <script src="js/views/financeiro.js"></script>
  <script src="js/views/equipamentos.js"></script>
  <script src="js/views/equipe.js"></script>
  <script src="js/views/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
